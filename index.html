
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d18">
  <title>Android Security Lab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <header>
      <div class="status">
        <span class="status-dot"></span>
        SYSTEM ONLINE
      </div>
      <h1>ANDROID <span>SECURITY LAB</span></h1>
      <p>Unicode Processing & Device Testing</p>
    </header>

    <section class="panel">
      <h2>Unicode Analyzer</h2>
      <p>Masukkan teks untuk dianalisis.</p>

      <textarea id="input"
        placeholder="Masukkan teks di sini..."></textarea>

      <div class="buttons">
        <button id="testBtn">Jalankan Pengujian</button>
        <button id="analyzeBtn" class="secondary">
          Analisis Unicode
        </button>
      </div>
    </section>

    <section class="panel">
      <h2>Hasil Pengujian</h2>
      <div class="stats">
        <div class="stat">
          <span>Karakter</span>
          <strong id="charCount">0</strong>
        </div>
        <div class="stat">
          <span>Ukuran UTF-8</span>
          <strong id="byteCount">0 B</strong>
        </div>
        <div class="stat">
          <span>Waktu</span>
          <strong id="timeCount">0 ms</strong>
        </div>
      </div>
      <div id="result" class="result">
        Menunggu pengujian...
      </div>
    </section>

    <section class="panel">
      <h2>Riwayat Pengujian</h2>
      <div id="history">
        Belum ada riwayat.
      </div>
      <button id="clearBtn" class="secondary">
        Hapus Riwayat
      </button>
    </section>

    <footer>
      ANDROID SECURITY LAB · LOCAL TESTING
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
